services:
  lbee:
    build: .
    image: lbee:latest
    container_name: lbee
    restart: unless-stopped

    # La clé API n'est jamais dans l'image ni dans config.yml.
    env_file:
      - .env

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./system_prompt.md:/app/system_prompt.md:ro
      - ./class-tools:/app/class-tools:ro
      - ./kb:/app/kb

    environment:
      # Surcharges ponctuelles possibles (ex. changer de modèle) :
      # LBE_MODEL: "gpt-4o-mini"
      LBE_ROOT: /app

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"