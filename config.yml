# ─────────────────────────────────────────────────────────────────────────────
#  lbee — configuration principale
#
#  Montée dans le conteneur en lecture seule :
#      ./config.yml:/app/config.yml:ro
#
#  ⚠️  Ne JAMAIS mettre de clé API ici. La clé est lue exclusivement depuis
#      la variable d'environnement API_KEY (voir .env.example).
#
#  Les chemins relatifs sont résolus depuis LBE_ROOT (/app dans l'image).
# ─────────────────────────────────────────────────────────────────────────────

llm:
  # URL de base compatible OpenAI (sans le suffixe /chat/completions).
  # Exemples : https://api.openai.com/v1, http://ollama:11434/v1,
  #            https://api.groq.com/openai/v1, https://openrouter.ai/api/v1
  base_url: "https://api.openai.com/v1"

  # Nom du modèle tel qu'attendu par /v1/chat/completions.
  model: "gpt-4o-mini"

  # Timeout HTTP en secondes (connexion + lecture).
  timeout: 60

  # Tentatives en cas d'erreur transitoire (429, 5xx, réseau).
  max_retries: 2

generation:
  # ⚠️ Seuls les paramètres standards OpenAI sont envoyés au premier niveau.
  # Les réglages propriétaires (top_k, repetition_penalty, min_p...) doivent
  # passer par extra_body, sinon l'API répond 400 Bad Request.
  temperature: 0.7
  top_p: 1.0
  max_tokens: 1024

  # Paramètres non standards, transmis tels quels (ex. vLLM / llama.cpp).
  extra_body: {}
  # Exemple :
  # extra_body:
  #   top_k: 40
  #   repeat_penalty: 1.1

  # Corps JSON fusionné uniquement lors de l'étape de décision d'outils.
  extra_body_tools: {}

memory:
  # Un des trois modes :
  #   one-shot          → aucune mémoire entre les appels
  #   personal          → historique persisté par session_id
  #   shared-compressed → historique global partagé, résumé automatiquement
  mode: one-shot

  # Fenêtre glissante : nombre maxi de messages renvoyés au modèle.
  max_history_messages: 20

  # Seuil (en caractères) au-delà duquel la mémoire partagée est résumée
  # par le LLM. Un résumé plus les N derniers messages sont conservés.
  compression_threshold: 6000

  # Messages bruts conservés après une compression (le reste part au résumé).
  keep_last_messages_after_compression: 6

features:
  # Charge et expose les outils Python de ./class-tools.
  enable_tools: true

  # Nombre maxi d'allers-retours modèle → outil → modèle (anti-boucle).
  max_tool_iterations: 5

  # Streaming SSE de la réponse finale. Les appels d'outils sont résolus
  # avant l'ouverture du flux : aucun fragment tool_calls n'est diffusé.
  enable_streaming: false

paths:
  # Prompt système (monté en lecture seule).
  system_prompt: "system_prompt.md"

  # Outils Python dynamiques.
  tools_dir: "class-tools"

  # Persistance : sessions/, shared_memory.json.
  kb_dir: "kb"